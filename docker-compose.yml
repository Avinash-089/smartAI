version: '3.8'

services:
  # Spring Boot Backend
  backend:
    build:
      context: ./student-management
      dockerfile: Dockerfile
    ports:
      - "8081:8080"
    environment:
      - PORT=8080
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql-17931356-avinashakula8055-6056.c.aivencloud.com:18502/defaultdb?sslMode=REQUIRED&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME:-avnadmin}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD}
      - JWT_SECRET=${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}

      - AI_SERVICE_URL=http://ai-service:5001
    depends_on:
      - ai-service
    restart: unless-stopped

  # Python AI Microservice
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    ports:
      - "5001:5001"
    environment:
      - PORT=5001
    restart: unless-stopped

  # React Frontend (Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:8081/api
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
